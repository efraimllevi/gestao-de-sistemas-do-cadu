ps{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}.chip{border-radius:30px;background:#213247;border:1px solid #354b62;padding:7px 10px;color:#bfd0e1;font-size:11px}

-height:1.3;margin:12px 0 7px}.price{color:var(--teal);font-size:22px;font-family:Manrope,sans-serif;font-weight:800}.price small{font:600 11px 'DM Sans',sans-serif;color:#91a4bb}.service-card p{font-size:11px;color:#889db5;line-height:1.5;margin:9px 0 0}

</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark">◇</div><div><div class="brand-name">OPERACIONAL</div><small>SEGURANÇA & EVENTOS</small></div></div><div><div class="menu-title">MENU PRINCIPAL</div><div class="sidebar-nav"><button class="nav active" data-tab="overview"><span class="ico">▦</span> Visão geral</button><button class="nav" data-tab="proposals"><span class="ico">▤</span> Propostas</button><button class="nav" data-tab="builder"><span class="ico">✦</span> Novo orçamento</button><button class="nav" data-tab="catalog"><span class="ico">▧</span> Catálogo de serviços</button><button class="nav" data-tab="roadmap"><span class="ico">▣</span> Contratos & QR</button></div></div><div class="side-bottom"><b>PROJETO EM DESENVOLVIMENTO</b><p>Base comercial importada da planilha FSE. Nome e marca definitivos ainda serão definidos.</p><small>LUMS DIGITAL · Edição 0.2</small></div></aside><div class="main"><header class="top"><span class="crumb">Painel administrativo / <b id="currentPage" style="color:#f2f5fb">Visão geral</b></span><div class="topright"><span class="env">● DEMONSTRAÇÃO LOCAL</span><div class="avatar">LD</div></div></header><main class="content" id="view"></main></div></div><script>

","price":520,"mode":"Diária","note":"Valor por profissional por dia"},{"id":21,"name":"SEGURANÇA PERNOITE","price":320,"mode":"Diária","note":"Valor por profissional por dia"},{"id":22,"name":"STAFF","price":270,"mode":"Diária","note":"Valor por profissional por dia"},{"id":23,"name":"TRANSPORTE (VAN)","price":0,"mode":"Consulta diária","note":"Informe o valor negociado"},{"id":24,"name":"UNIFILA DE CORRENTE","price":15,"mode":"Unidade","note":"Valor por unidade no evento"},{"id":25,"name":"UNIFILA DE METAL","price":50,"mode":"Unidade","note":"Valor por unidade no evento"},{"id":26,"name":"MOBILIÁRIO KIDS","price":300,"mode":"Unidade","note":"Valor por unidade no evento"},{"id":27,"name":"TRANSPORTE EXECUTIVO UTILITÁRIO","price":1600,"mode":"Diária","note":"Valor por dia"},{"id":28,"name":"TRANSPORTE EXECUTIVO","price":1600,"mode":"Diária","note":"Valor por dia"},{"id":29,"name":"PRODUTOR DE EVENTOS","price":0,"mode":"Diária","note":"Defina o valor negociado"},{"id":30,"name":"SEGURANÇA EXTERNO","price":270,"mode":"Diária","note":"Valor por profissional por dia"},{"id":31,"name":"ORIENTADOR DE FLUXO","price":270,"mode":"Diária","note":"Valor por profissional por dia"},{"id":32,"name":"COORDENADOR","price":350,"mode":"Diária","note":"Valor por profissional por dia"},{"id":33,"name":"DESARME","price":420,"mode":"Diária","note":"Valor por profissional por dia"},{"id":34,"name":"MOTORISTA AMIGO - DUPLA","price":540,"mode":"Diária","note":"Valor por dupla por dia"}];
const SKEY="fse-premium-v1";
const SAMPLE={id:"FSE-2026-001",client:"CBG",organization:"CBG",venue:"CONSTÂNCIO VIEIRA",start:"2026-11-04",end:"2026-11-15",audience:"",invoice:true,status:"Rascunho",created:"2026-11-23",rows:[
{serviceId:1,start:"2026-11-04",end:"2026-11-08",qty:2,override:null},
{serviceId:1,start:"2026-11-09",end:"2026-11-15",qty:4,override:null},
{serviceId:18,start:"2026-11-07",end:"2026-11-08",qty:2,override:280},
{serviceId:3,start:"2026-11-11",end:"2026-11-15",qty:2,override:null},
{serviceId:11,start:"2026-11-04",end:"2026-11-08",qty:1,override:3000},
{serviceId:18,start:"2026-11-10",end:"2026-11-10",qty:2,override:280},
{serviceId:18,start:"2026-11-11",end:"2026-11-15",qty:4,override:280}
]};
let data;
try{data=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
if(!data||!Array.isArray(data.proposals)||!Array.isArray(data.services))data={services:CATALOG,proposals:[SAMPLE],counter:2};
let current=null,tab="overview",search="";
const $=q=>document.querySelector(q);
const fmt=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shortDate=x=>x?x.split("-").reverse().join("/"):"—";
const days=(a,b)=>{if(!a||!b)return 0;let z=Math.round((Date.parse(b+"T12:00:00Z")-Date.parse(a+"T12:00:00Z"))/86400000)+1;return Math.max(z,0)};
const save=()=>localStorage.setItem(SKEY,JSON.stringify(data));
const service=id=>data.services.find(s=>s.id===+id);
const count=(p,r)=>days(r.start||p.start,r.end||p.end);
function unit(p,r){const s=service(r.serviceId);if(!s)return 0;if(r.override!==null&&r.override!==""&&Number.isFinite(+r.override))return +r.override;if(s.mode==="Público")return Math.max(250,Number(p.audience||0)*2);return +s.price||0}
function rowTotal(p,r){const s=service(r.serviceId);if(!s)return 0;const price=unit(p,r);if(s.mode==="Público")return price;if(s.mode==="Fixo")return price*(+r.qty||1);if(s.mode==="Unidade")return price*(+r.qty||0);return price*(+r.qty||0)*count(p,r)}
function total(p){let sub=(p.rows||[]).reduce((a,r)=>a+rowTotal(p,r),0);let tax=p.invoice?sub*.15:0;return {sub,tax,grand:sub+tax}}
function nav(t){tab=t;document.querySelectorAll(".nav").forEach(el=>el.classList.toggle("active",el.dataset.tab===t));render()}
function toast(msg){let n=document.createElement("div");n.className="flash";n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2800)}
function head(over,title,subtitle,actions=""){return '<div class="heading"><div><div class="eyebrow">'+over+'</div><h1>'+title+'</h1><p class="sub">'+subtitle+'</p></div>'+actions+'</div>'}
function statusBadge(s){return '<span class="pill '+(s==="Aprovada"?"done":s==="Rascunho"?"draft":"pending")+'">'+esc(s)+'</span>'}
function overview(){
let totalQuoted=data.proposals.reduce((x,p)=>x+total(p).grand,0);
let approved=data.proposals.filter(p=>p.status==="Aprovada").length;
let pending=data.proposals.filter(p=>p.status!=="Aprovada").length;
return head("CENTRAL DE OPERAÇÕES","Visão geral","Controle comercial de segurança, apoio e estrutura para eventos.",'<button class="btn" onclick="newQuote()">＋ Novo orçamento</button>')+
'<div class="notice"><b>Ambiente demonstrativo.</b> Dados salvos somente neste navegador. Pagamentos, assinaturas, QR Codes e contratos válidos exigem backend e integrações reais.</div>'+
'<div class="kpis"><div class="card kpi"><div class="label">Volume de propostas</div><div class="value">'+data.proposals.length+'</div><div class="tag">● Base comercial</div></div><div class="card kpi"><div class="label">Valor total orçado</div><div class="value">'+fmt(totalQuoted)+'</div><div class="tag">● Inclui NF quando selecionada</div></div><div class="card kpi"><div class="label">Propostas aprovadas</div><div class="value">'+approved+'</div><div class="tag">● Status manual</div></div><div class="card kpi"><div class="label">Em acompanhamento</div><div class="value">'+pending+'</div><div class="tag">● Necessitam revisão</div></div></div>'+
'<div class="grid2"><div class="card"><div class="panel-head"><h2>Propostas recentes</h2><button class="btn alt sm" onclick="nav(\'proposals\')">Ver todas →</button></div><div class="table-wrap">'+quoteTable(data.proposals.slice(0,5))+'</div></div><div class="card"><div class="panel-head"><h2>Catálogo comercial</h2><span class="pill done">'+data.services.length+' serviços</span></div><div class="panel-body"><div style="font-size:30px;font-weight:800;font-family:Manrope">Regras da planilha</div><div class="service-chips"><span class="chip">Diária</span><span class="chip">Fixo</span><span class="chip">Unidade</span><span class="chip">Público</span><span class="chip">Consulta diária</span></div><div class="spark">'+[45,70,55,87,68,94,78,100,68,86].map(h=>'<div style="height:'+h+'%"></div>').join('')+'</div><p class="footnote">Os valores foram extraídos das abas Serviços e Montagem. Este gráfico é apenas decorativo, não representa faturamento real.</p></div></div></div>'
}
function quoteTable(arr){return arr.length?'<table class="data-table"><thead><tr><th>Proposta</th><th>Evento / Local</th><th>Investimento</th><th>Status</th><th>Ação</th></tr></thead><tbody>'+arr.map(p=>'<tr><td><div class="cell-title">'+esc(p.id)+'</div><div class="cell-sub">'+esc(p.client)+'</div></td><td><div class="cell-title">'+esc(p.venue||"Não informado")+'</div><div class="cell-sub">'+shortDate(p.start)+' — '+shortDate(p.end)+'</div></td><td><b>'+fmt(total(p).grand)+'</b></td><td>'+statusBadge(p.status)+'</td><td><button class="btn alt sm" onclick="editQuote(\''+esc(p.id)+'\')">Abrir →</button></td></tr>').join('')+'</tbody></table>':'<div class="empty"><div class="big">◇</div>Nenhuma proposta cadastrada</div>'}
function proposals(){let list=data.proposals.filter(p=>(p.id+" "+p.client+" "+p.venue).toLowerCase().includes(search.toLowerCase()));return head("PROPOSTAS COMERCIAIS","Orçamentos","Acompanhe valores, detalhes e andamento das propostas.",'<button class="btn" onclick="newQuote()">＋ Nova proposta</button>')+'<div class="card"><div class="searchbar"><input class="input" style="max-width:380px" placeholder="Buscar por cliente, evento ou número..." value="'+esc(search)+'" oninput="search=this.value;document.getElementById(\'result\').innerHTML=quoteTable(data.proposals.filter(p=>(p.id+\' \'+p.client+\' \'+p.venue).toLowerCase().includes(search.toLowerCase())))"><span class="muted">'+list.length+' registros</span></div><div id="result" class="table-wrap">'+quoteTable(list)+'</div></div>'}
function catalogView(){return head("TABELA DE PREÇOS","Catálogo de serviços","34 serviços e regras de cálculo reproduzidos a partir da planilha.")+'<div class="notice">Valores de referência da planilha. A coluna “Consulta diária” e os serviços sem preço precisam de negociação manual. Edições feitas aqui afetam novos cálculos neste navegador, sem alterar a planilha original.</div><div class="service-grid">'+data.services.map(s=>'<div class="card service-card"><div><div class="cat">'+esc(s.mode)+'</div><h3>'+esc(s.name)+'</h3><p>'+esc(s.note)+'</p></div><div style="display:flex;align-items:end;justify-content:space-between;gap:10px"><div class="price">'+(s.mode==="Público"?"R$ 2,00":s.price?fmt(s.price):"A consultar")+'<small> '+(s.mode==="Diária"||s.mode==="Consulta diária"?"/ diária":s.mode==="Unidade"?"/ unidade":s.mode==="Público"?"/ pessoa":"")+'</small></div><button class="btn ghost sm" onclick="changePrice('+s.id+')">Editar</button></div></div>').join('')+'</div>'}
function newQuote(){current={id:"FSE-"+new Date().getFullYear()+"-"+String(data.counter++).padStart(3,"0"),client:"",organization:"",venue:"",start:"",end:"",audience:"",invoice:false,status:"Rascunho",created:new Date().toISOString().slice(0,10),rows:[]};nav("builder")}
function editQuote(id){current=JSON.parse(JSON.stringify(data.proposals.find(p=>p.id===id)));nav("builder")}
function field(label,id,type="text",value="",extra=""){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" class="input" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>'}
function builder(){if(!current)newQuote();let p=current;return head("ESTÚDIO DE PROPOSTAS","Montar orçamento","Preencha o evento e os itens. Os totais são calculados em tempo real.",'<div class="controls"><button class="btn alt" onclick="nav(\'proposals\')">← Voltar</button><button class="btn" onclick="saveQuote()">Salvar orçamento</button></div>')+
'<div class="build-layout"><div><div class="card"><div class="panel-head"><h2>01 · Dados do evento</h2><span class="pill draft">'+esc(p.id)+'</span></div><div class="panel-body"><div class="form-grid">'+
field("CLIENTE / EVENTO","client","text",p.client,'placeholder="Nome do contratante"')+field("ORGANIZAÇÃO","organization","text",p.organization)+field("DATA INICIAL","start","date",p.start)+field("DATA FINAL","end","date",p.end)+
'<div class="field span2"><label>LOCAL DO EVENTO</label><input id="venue" class="input" value="'+esc(p.venue)+'" placeholder="Endereço, ginásio, espaço..."></div>'+field("PÚBLICO ESTIMADO","audience","number",p.audience,'min="0"')+
'<div class="field"><label>NOTA FISCAL</label><select id="invoice" class="input"><option value="0" '+(!p.invoice?"selected":"")+'>Sem nota fiscal</option><option value="1" '+(p.invoice?"selected":"")+'>Com nota fiscal (+15%)</option></select></div></div></div></div>'+
'<div class="card"><div class="panel-head"><h2>02 · Serviços e operações</h2><button class="btn alt sm" onclick="addRow()">＋ Adicionar serviço</button></div><div class="panel-body"><div class="notice">Diária = quantidade × dias inclusivos × valor; Fixo e Unidade = quantidade × valor; Público = R$ 2 por convidado, mínimo R$ 250, sem multiplicar por dias. Um valor manual substitui o valor de tabela apenas neste item.</div><div id="lines">'+lineMarkup(p)+'</div><button class="btn alt" onclick="addRow()">＋ Inserir outro item</button></div></div></div>'+
'<div class="card sticky"><div class="panel-head"><h2>Resumo financeiro</h2><span class="pill done">Automático</span></div><div class="panel-body"><div style="color:#96a9c2;font-size:11px">VALOR PROJETADO</div><div id="grandBig" style="font:800 31px Manrope;color:var(--teal);letter-spacing:-1px;margin:10px 0 22px">'+fmt(total(p).grand)+'</div><div class="totals"><span>Serviços</span><b id="subtotal">'+fmt(total(p).sub)+'</b></div><div class="totals"><span>Nota fiscal (15%)</span><b id="tax">'+fmt(total(p).tax)+'</b></div><div class="totals final"><span>Total</span><b id="grand">'+fmt(total(p).grand)+'</b></div><div class="divider"></div><label>STATUS COMERCIAL</label><select id="status" class="input"><option '+(p.status==="Rascunho"?"selected":"")+'>Rascunho</option><option '+(p.status==="Enviada"?"selected":"")+'>Enviada</option><option '+(p.status==="Aprovada"?"selected":"")+'>Aprovada</option><option '+(p.status==="Cancelada"?"selected":"")+'>Cancelada</option></select><div class="controls" style="margin-top:18px"><button class="btn" style="width:100%" onclick="saveQuote()">Salvar proposta</button><button class="btn alt" style="width:100%" onclick="printQuote()">↗ Visualizar / imprimir PDF</button></div><p class="footnote">Proposta válida por 15 dias; jornada de referência: 8 horas. Horas excedentes são negociadas à parte segundo a planilha (+R$ 30/h por profissional). Contrato e assinatura digital ainda não estão disponíveis.</p></div></div></div>'}
function lineMarkup(p){return p.rows.length?p.rows.map((r,i)=>{let s=service(r.serviceId)||data.services[0];return '<div class="line-row"><div class="row-header"><strong>ITEM '+String(i+1).padStart(2,"0")+' · '+esc(s.name)+'</strong><button class="btn danger sm" onclick="removeRow('+i+')">Remover</button></div><div class="field" style="margin-bottom:12px"><label>SERVIÇO</label><select class="input" onchange="patchRow('+i+',\'serviceId\',this.value)">'+data.services.map(x=>'<option value="'+x.id+'" '+(x.id===r.serviceId?"selected":"")+'>'+esc(x.name)+' · '+esc(x.mode)+'</option>').join('')+'</select></div><div class="row-line-grid">'+fieldRow("INÍCIO",i,"start","date",r.start||p.start)+fieldRow("FIM",i,"end","date",r.end||p.end)+fieldRow("QUANTIDADE",i,"qty","number",r.qty||1)+fieldRow("PREÇO MANUAL",i,"override","number",r.override??"", 'placeholder="Automático" step="0.01" min="0"')+'<div class="field"><label>PERÍODO</label><div class="input" style="display:flex;align-items:center">'+count(p,r)+' dia(s)</div></div></div><div class="line-total">'+fmt(rowTotal(p,r))+' <span style="color:#879bb4;font-size:11px">subtotal</span></div></div>'}).join(''):'<div class="empty"><div class="big">＋</div>Adicione um serviço para começar o orçamento.</div>'}
function fieldRow(l,i,k,t,val,extra=""){return '<div class="field"><label>'+l+'</label><input class="input" type="'+t+'" value="'+esc(val)+'" '+extra+' onchange="patchRow('+i+',\''+k+'\',this.value)"></div>'}
function readForm(){if(!current)return;for(let k of ["client","organization","venue","start","end","audience","invoice","status"]){let el=document.getElementById(k);if(el)current[k]=k==="invoice"?el.value==="1":el.value} }
function updateTotals(){if(!current)return;let t=total(current);for(let [id,v] of [["subtotal",t.sub],["tax",t.tax],["grand",t.grand],["grandBig",t.grand]]){let x=document.getElementById(id);if(x)x.textContent=fmt(v)}}
function patchRow(i,k,v){readForm();if(k==="qty"||k==="serviceId")v=+v;if(k==="override")v=v===""?null:+v;current.rows[i][k]=v;$("#lines").innerHTML=lineMarkup(current);updateTotals()}
function addRow(){readForm();current.rows.push({serviceId:1,start:current.start,end:current.end,qty:1,override:null});$("#lines").innerHTML=lineMarkup(current);updateTotals()}
function removeRow(i){readForm();current.rows.splice(i,1);$("#lines").innerHTML=lineMarkup(current);updateTotals()}
function saveQuote(){readForm();if(!current.client.trim()){toast("Preencha o cliente ou evento.");return}if(current.start&&current.end&&days(current.start,current.end)===0){toast("Corrija o período do evento.");return}if(current.rows.some(r=>{let s=service(r.serviceId);return s&&s.mode!=="Público"&&unit(current,r)===0})){toast("Há serviço sem preço. Informe o valor manual.");return}let i=data.proposals.findIndex(p=>p.id===current.id);let copy=JSON.parse(JSON.stringify(current));if(i<0)data.proposals.unshift(copy);else data.proposals[i]=copy;save();toast("Proposta salva neste navegador.");nav("proposals")}
function changePrice(id){let s=service(id);let v=prompt("Novo preço para "+s.name+" (R$):",s.price);if(v===null)return;v=Number(v.replace(",","."));if(!Number.isFinite(v)||v<0){toast("Preço inválido.");return}s.price=v;save();render();toast("Preço atualizado localmente.")}
function printQuote(){readForm();if(!current.client.trim()){toast("Informe o cliente para imprimir.");return}let p=current,t=total(p),win=window.open("","_blank");if(!win){toast("Permita pop-ups para gerar o PDF.");return}let rows=p.rows.map(r=>{let s=service(r.serviceId),d=count(p,r);return '<tr><td>'+esc(r.start?shortDate(r.start):"—")+(r.end&&r.end!==r.start?' a '+shortDate(r.end):'')+'</td><td>'+esc(s?.name||"")+'</td><td>'+esc(r.qty)+'</td><td>'+(s?.mode==="Fixo"||s?.mode==="Unidade"||s?.mode==="Público"?"—":d)+'</td><td>'+fmt(unit(p,r))+'</td><td>'+fmt(rowTotal(p,r))+'</td></tr>'}).join("");let html='<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Orçamento '+esc(p.id)+'</title><style>body{font:13px Arial;color:#172337;margin:40px}header{border-bottom:4px solid #178d82;padding-bottom:18px;display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:bold}small{color:#66778c}.header2{background:#f1f6f7;padding:15px;margin:24px 0;line-height:1.85}table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:10px 8px;border-bottom:1px solid #d7e1e8;text-align:left}th{background:#133145;color:white}td:last-child,th:last-child{text-align:right}.total{margin:25px 0 0 auto;width:300px}.total>div{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #ccd6dd}.grand{font-size:18px;font-weight:bold;color:#067e72}.notes{margin-top:30px;color:#4c5c6c;font-size:11px;line-height:1.6}@media print{body{margin:16mm}}</style></head><body><header><div><div class="brand">PROPOSTA DE ORÇAMENTO</div><small>Documento comercial • '+esc(p.id)+'</small></div><div style="text-align:right"><b>SEGURANÇA & EVENTOS</b><div><small>Modelo baseado na planilha FSE</small></div></div></header><div class="header2"><b>EVENTO / CLIENTE:</b> '+esc(p.client)+'<br><b>ORGANIZAÇÃO:</b> '+esc(p.organization||"—")+'<br><b>LOCAL:</b> '+esc(p.venue||"—")+'<br><b>PERÍODO:</b> '+shortDate(p.start)+' a '+shortDate(p.end)+'<br><b>PÚBLICO:</b> '+esc(p.audience||"Não informado")+'</div><table><thead><tr><th>PERÍODO</th><th>SERVIÇO</th><th>QTD</th><th>DIAS</th><th>VALOR UNIT.</th><th>SUBTOTAL</th></tr></thead><tbody>'+rows+'</tbody></table><div class="total"><div><span>TOTAL DOS SERVIÇOS</span><b>'+fmt(t.sub)+'</b></div><div><span>NOTA FISCAL (15%)</span><b>'+fmt(t.tax)+'</b></div><div class="grand"><span>TOTAL DO ORÇAMENTO</span><b>'+fmt(t.grand)+'</b></div></div><div class="notes"><b>TERMOS E CONDIÇÕES</b><br>Proposta válida por 15 dias. Carga horária de referência: 8 horas; excedentes terão acréscimo de R$ 30,00/hora por profissional, a confirmar conforme contratação.<br><br>Documento de orçamento para análise. Não constitui contrato assinado, confirmação de pagamento ou documento fiscal.<br>Fonte dos critérios: planilha de orçamento FSE fornecida para o projeto.</div></body></html>';win.document.write(html);win.document.close();win.focus();setTimeout(()=>win.print(),350)}
function roadmap(){return head("ETAPAS DE IMPLANTAÇÃO","Contratos e QR Code","Módulos previstos para a plataforma final.")+'<div class="grid2"><div class="card"><div class="panel-head"><h2>Contratos digitais</h2><span class="pill pending">Próxima fase</span></div><div class="panel-body"><p class="sub">Geração a partir do orçamento aprovado, modelos revisados e assinatura por fornecedor especializado. A assinatura ainda não está integrada.</p><div class="service-chips"><span class="chip">Modelo jurídico</span><span class="chip">PDF</span><span class="chip">Assinatura</span><span class="chip">Trilha de auditoria</span></div></div></div><div class="card"><div class="panel-head"><h2>Etiquetas com QR Code</h2><span class="pill pending">Próxima fase</span></div><div class="panel-body"><p class="sub">QR Code com identificador opaco e página pública de status reduzido. A situação de pagamento só poderá ser confirmada por integração segura com o gateway ou conferência autenticada.</p><div class="service-chips"><span class="chip">Token seguro</span><span class="chip">Validação no servidor</span><span class="chip">Status de contrato</span><span class="chip">Status de pagamento</span></div></div></div></div><div class="notice" style="margin-top:20px">Nenhum QR Code, assinatura ou status de pagamento é emitido nesta versão. Esses módulos não devem ser simulados como validação real.</div>'}
function render(){const titles={overview:"Visão geral",proposals:"Propostas",builder:"Novo orçamento",catalog:"Catálogo",roadmap:"Contratos & QR"};$("#currentPage").textContent=titles[tab]||"Painel";$("#view").innerHTML=tab==="overview"?overview():tab==="proposals"?proposals():tab==="catalog"?catalogView():tab==="builder"?builder():roadmap();if(tab==="builder"){["client","organization","venue","start","end","audience","invoice","status"].forEach(k=>{let el=document.getElementById(k);if(el)el.addEventListener("change",()=>{readForm();updateTotals()})})}}
document.querySelectorAll(".nav").forEach(x=>x.addEventListener("click",()=>nav(x.dataset.tab)));
render();
</script></body></html>
